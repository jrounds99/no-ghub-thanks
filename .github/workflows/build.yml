name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Doc-only changes don't produce a new build (and don't trigger updates).
    paths-ignore: ["**.md", "LICENSE", "assets/app.png"]
  pull_request:
  workflow_dispatch:
    inputs:
      display_name:
        description: "Display name (what Task Manager shows). Leave blank for the default."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          APP_DISPLAY_NAME: ${{ inputs.display_name }}
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/no-ghub-thanks.exe dist/
          (Get-FileHash dist/no-ghub-thanks.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/no-ghub-thanks.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: no-ghub-thanks
          path: dist/*

      # Every push to main refreshes the rolling "latest" pre-release.
      # Custom-name builds (manual runs with a display name) stay as artifacts only.
      - name: Publish latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest dist/* --prerelease --target $env:GITHUB_SHA `
            --title "Latest build ($($env:GITHUB_SHA.Substring(0,7)))" `
            --notes "Rolling build of main. For a stable version use the newest v* release."

      # Version tags get a normal release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/* --generate-notes
