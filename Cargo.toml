[package]
name = "no-ghub-thanks"
version = "1.0.2"
edition = "2024"
description = "Tiny tray replacement for Logitech G HUB: battery %, lighting on/off, lighting profiles. Talks HID++ 2.0 directly."
license = "MIT"
repository = "https://github.com/jrounds99/no-ghub-thanks"

[dependencies]
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.1"
tray-icon = "0.26.1"
wry = "0.57.0"

[target.'cfg(windows)'.dependencies]
notify-rust = "4.18.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_Security", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
winreg = "0.56.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
