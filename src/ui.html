<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #3b82f6;
    --bg: #f3f3f3;
    --card: #ffffff;
    --text: #1b1b1b;
    --muted: #616161;
    --line: rgba(0,0,0,.08);
    --track: rgba(0,0,0,.10);
    --chip: #f7f7f7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202020;
      --card: #2b2b2b;
      --text: #f2f2f2;
      --muted: #a8a8a8;
      --line: rgba(255,255,255,.08);
      --track: rgba(255,255,255,.12);
      --chip: #323232;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); overflow: hidden; user-select: none; }
  body { font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; padding: 12px; }

  .hero {
    position: relative; border-radius: 10px; padding: 14px 16px 16px; overflow: hidden;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 85%, #000) 0%,
                                        color-mix(in srgb, var(--accent) 55%, #8b5cf6) 100%);
    color: #fff;
  }
  .hero::after {
    content: ""; position: absolute; inset: -40% -20% auto auto; width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(255,255,255,.22), transparent 70%);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { font-weight: 600; font-size: 14px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,.18); white-space: nowrap; }
  .pct { font: 600 40px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; margin: 10px 0 10px; letter-spacing: -1px; }
  .pct small { font-size: 16px; font-weight: 500; opacity: .8; margin-left: 2px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; transition: width .4s ease;
           background: linear-gradient(90deg, #ff5f57, #ffbd2e 45%, #28c840); background-size: 300px 100%; }
  .bar.charging i { background: linear-gradient(90deg, #5ac8fa, #7dd3fc, #5ac8fa); background-size: 200% 100%;
                    animation: flow 1.6s linear infinite; }
  @keyframes flow { to { background-position: -200% 0; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .label { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }

  .switch { position: relative; width: 40px; height: 20px; flex: none; cursor: pointer; }
  .switch input { display: none; }
  .switch span { position: absolute; inset: 0; border-radius: 10px; border: 1px solid var(--muted); transition: .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px;
                        border-radius: 50%; background: var(--muted); transition: .15s; }
  .switch input:checked + span { border-color: transparent;
                                 background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #8b5cf6)); }
  .switch input:checked + span::after { left: 23px; background: #fff; }

  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; cursor: pointer;
          background: var(--chip); border: 1px solid var(--line); transition: border-color .15s, opacity .15s; min-width: 0; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .chip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .dim .chip, .dim .slider { opacity: .45; pointer-events: none; }
  .sw { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .sw.breathe { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .25; } }
  .sw.cycle { background: conic-gradient(#f43f5e, #f59e0b, #84cc16, #06b6d4, #8b5cf6, #f43f5e); }
  .sw.battery { background: linear-gradient(135deg, #28c840, #ffbd2e 50%, #ff5f57); }
  .sw.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }

  .slider { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
  input[type=range] { -webkit-appearance: none; flex: 1; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent) var(--v, 100%), var(--track) var(--v, 100%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--card); border: 4px solid var(--accent); box-shadow: 0 0 0 1px var(--line); }

  .warn { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 12px;
          background: color-mix(in srgb, #f59e0b 16%, var(--card)); border: 1px solid color-mix(in srgb, #f59e0b 40%, transparent); }
  .warn a { color: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; }

  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 0 2px; }
  .foot label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; cursor: pointer; }
  .links a { color: var(--muted); font-size: 12px; margin-left: 12px; cursor: pointer; text-decoration: none; }
  .links a:hover { color: var(--text); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="hero">
    <div class="row">
      <div class="name" id="name">Looking for your mouse…</div>
      <div class="pill" id="pill">—</div>
    </div>
    <div class="pct" id="pct">--<small>%</small></div>
    <div class="bar" id="bar"><i id="fill" style="width:0"></i></div>
  </div>

  <div class="card" id="lighting">
    <div class="row">
      <div><div class="label">Lighting</div><div class="sub" id="lsub">Off on every connect</div></div>
      <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="slider"><span class="sub">☀</span><input type="range" id="bright" min="10" max="100" step="5"><span class="sub" id="bval"></span></div>
  </div>

  <div class="warn hidden" id="warn">
    Logitech LampArray Service is running and may override your lighting.
    <a id="fix">Copy fix command</a>
  </div>

  <div class="foot">
    <label><span class="switch" style="width:32px;height:16px"><input type="checkbox" id="auto"><span></span></span>Start with Windows</label>
    <div class="links"><a id="edit">Edit profiles</a><a id="quit">Quit</a></div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const send = (cmd, extra) => window.ipc.postMessage(JSON.stringify(Object.assign({ cmd }, extra || {})));
  let state = null;

  function swatch(p) {
    const el = document.createElement('i');
    el.className = 'sw ' + p.effect;
    if (p.effect === 'static' || p.effect === 'breathe') el.style.background = p.color;
    return el;
  }

  window.render = s => {
    state = s;
    document.documentElement.style.setProperty('--accent', s.accent);
    $('name').textContent = s.name || 'Looking for your mouse…';
    const pill = !s.found ? 'Not found' : !s.online ? 'Asleep' :
      (s.wired ? 'Wired' : 'Wireless') + (s.charging ? ' · Charging' : s.full ? ' · Full' : '');
    $('pill').textContent = pill;
    const p = (s.online && s.percent != null) ? s.percent : null;
    $('pct').innerHTML = (p == null ? '--' : p) + '<small>%</small>';
    $('fill').style.width = (p || 0) + '%';
    // Keep the gradient anchored to the full bar width so the color reflects the level.
    $('fill').style.backgroundSize = s.charging ? '' : (p ? (100 / p * 100) : 100) + '% 100%';
    $('bar').classList.toggle('charging', !!s.charging);

    $('enabled').checked = s.enabled;
    $('lighting').classList.toggle('dim', !s.enabled);
    $('lsub').textContent = s.enabled ? s.active : 'Off on every connect';

    const chips = $('chips');
    chips.replaceChildren(...s.profiles.map(p => {
      const c = document.createElement('div');
      c.className = 'chip' + (p.name === s.active ? ' on' : '');
      c.title = p.name;
      const t = document.createElement('span'); t.textContent = p.name;
      c.append(swatch(p), t);
      c.onclick = () => send('profile', { name: p.name });
      return c;
    }));

    $('bright').value = s.brightness;
    $('bright').style.setProperty('--v', ((s.brightness - 10) / 90 * 100) + '%');
    $('bval').textContent = s.brightness + '%';
    $('auto').checked = s.autostart;
    $('warn').classList.toggle('hidden', !s.lamparray);
    send('height', { value: Math.ceil(document.body.scrollHeight) });
  };

  $('enabled').onchange = e => send('toggle', { on: e.target.checked });
  $('auto').onchange = e => send('autostart', { on: e.target.checked });
  $('bright').oninput = e => {
    e.target.style.setProperty('--v', ((e.target.value - 10) / 90 * 100) + '%');
    $('bval').textContent = e.target.value + '%';
  };
  $('bright').onchange = e => send('brightness', { value: +e.target.value });
  $('edit').onclick = () => send('edit');
  $('quit').onclick = () => send('quit');
  $('fix').onclick = () => { navigator.clipboard.writeText(state.fix); $('fix').textContent = 'Copied — paste into PowerShell'; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') send('hide'); });
  document.addEventListener('contextmenu', e => e.preventDefault());
  send('ready');
</script>
</body>
</html>
